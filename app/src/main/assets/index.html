<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOEIC 단어</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1c1c1f;--sub:#707078;--line:#e2e0d8;--accent:#2f5bea;--accentInk:#fff;
--ok:#16894a;--okbg:#e3f5ea;--bad:#cf3b3b;--badbg:#fbe8e8}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d21;--ink:#f1f1f3;--sub:#9a9aa3;--line:#2d2d33;
--accent:#6f8dff;--accentInk:#0d0d10;--ok:#43d184;--okbg:#14301f;--bad:#ff6e6e;--badbg:#3a1a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 28px;display:flex;flex-direction:column}
h1{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 28px;letter-spacing:.02em}
.day{font-size:52px;font-weight:800;letter-spacing:-.03em;margin:0}
.muted{color:var(--sub);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;
background:var(--accent);color:var(--accentInk);margin-top:10px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.spacer{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:10px}
.x{background:none;border:0;color:var(--sub);font-size:22px;padding:4px 8px;margin:-4px -8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.word.long{font-size:30px}.word.xlong{font-size:24px}
.word{font-size:40px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:28px 0 8px;word-break:break-word}
.pos{text-align:center;margin-bottom:26px}
.say{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.say button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:14px}
.say button:active{transform:scale(.96)}
.ipa{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin:-2px 0 12px;font-size:15px;color:var(--sub);font-family:"Noto Sans","Segoe UI","Lucida Sans Unicode","DejaVu Sans",system-ui,sans-serif}
.ipa i{font-style:normal;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:5px;vertical-align:1px}
.known{display:block;width:100%;margin-top:8px;border:1px dashed var(--ok);background:transparent;color:var(--ok);border-radius:14px;padding:12px;font-family:inherit;font-size:14px;font-weight:600}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:8px}
.undo button,.mini{border:0;background:none;font:inherit;font-weight:700;color:var(--accent);padding:4px}
.undo button{color:#8fb0ff}
.mini{font-size:13px;flex:none}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);
border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:10px;font-size:17px;font-family:inherit}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--bg);color:var(--sub)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad b{background:var(--bad);color:#fff}
.score{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.score small{font-size:22px;color:var(--sub);font-weight:600}
.list{margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row span:last-child{color:var(--sub);text-align:right}
.hd{display:flex;align-items:center;gap:8px;margin:0 0 20px}.hd h1{margin:0;flex:1}
.badge{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:4px 10px;font-family:inherit;font-weight:700;font-size:12px}
.badge.premium{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.badge.basic{color:var(--accent);border-color:var(--accent)}
.lockbtn{color:var(--sub)}
#fakead{position:fixed;left:0;right:0;bottom:0;height:56px;display:grid;place-items:center;background:#ddd;color:#555;font-size:13px;border-top:1px solid #bbb}
body.withad #app{padding-bottom:72px}
#fakeint{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:18px;z-index:9}
.gear{border:0;background:none;color:var(--sub);font-size:22px;padding:2px 4px}
.dayrow{display:flex;align-items:flex-end;justify-content:space-between}
.link{border:0;background:none;color:var(--accent);font-family:inherit;font-weight:600;font-size:14px;padding:0 0 10px}
.notice{margin-top:4px;line-height:1.6}.notice .btn{font-size:15px;padding:12px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:18px 0 6px}

.amtval{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:34px 0 4px}
.amtval b{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amtval span{color:var(--sub);font-size:16px}
.amttier{text-align:center;font-size:14px;font-weight:600;min-height:20px;color:var(--sub)}
.amttier.basic{color:#d08a12}.amttier.premium{color:var(--accent)}
.slider{position:relative;margin:30px 18px 8px;height:44px}
.slider .zones{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.z{position:absolute;top:0;bottom:0;opacity:.35}
.z.free{background:#8a8a94}.z.basic{background:#f0a020}.z.premium{background:var(--accent)}
.slider input{position:absolute;left:-15px;right:-15px;width:calc(100% + 30px);top:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.slider input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) 0 var(--p,0%),transparent var(--p,0%))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.slider input::-moz-range-track{height:8px;border-radius:4px;background:transparent}
.slider input::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
.slider input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.ticks{position:absolute;left:0;right:0;top:40px;height:16px}
.ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--sub)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:30px;font-size:12px;color:var(--sub)}
.legend .z{position:static;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;opacity:.6}
.plan{margin-bottom:12px}.plan.cur{border-color:var(--accent)}.plan-h{display:flex;align-items:center;justify-content:space-between;font-size:20px}
.plan ul{margin:10px 0 4px;padding-left:18px;line-height:1.8;color:var(--sub);font-size:14px}
.rowbtn{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;text-align:left;padding:14px 0}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.dayc{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 0 6px;font-family:inherit;font-weight:700;font-size:16px}
.dayc small{display:block;height:14px;font-size:11px;color:var(--ok)}.dayc.prog small{color:var(--accent)}
.dayc.done{background:var(--okbg)}.dayc.on{border-color:var(--accent)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
#tabs[hidden]{display:none}
#tabs button{border:0;background:none;color:var(--sub);font-family:inherit;font-size:12px;font-weight:600;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.6}
#tabs button.on{color:var(--accent)}#tabs button.on i{filter:none;opacity:1}
body.withtabs #app{padding-bottom:90px}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 8px}
.menu{padding:2px 16px}.menu .row{align-items:center;min-height:52px;padding:6px 0}
.menu .row small,.note .row small{display:block;font-size:12px;margin-top:2px;font-weight:400}
.menu .rowbtn span:last-child{color:var(--sub)}
.stats.big2 .stat div{font-size:28px}
.sub{font-size:12px;margin-top:-10px}
.tgl{display:flex;align-items:center;gap:8px;border:0;background:none;font-family:inherit;font-size:13px;color:var(--sub);padding:0;flex:none}
.tgl i{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);transition:background .2s}
.tgl i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on{color:var(--accent)}.tgl.on i{background:var(--accent)}.tgl.on i::after{transform:translateX(18px)}
.tin{display:flex;align-items:center;gap:4px;font-weight:700}
.tin input{width:44px;text-align:center;font:inherit;font-size:18px;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--bg);color:var(--ink)}
.tin .mini{margin-left:6px}
input[type=time]{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink)}
.wl .row>span:first-child{flex:0 0 42%}.wl .row>span:last-child{flex:1;text-align:left!important}
.wl .head{font-size:12px;font-weight:700;color:var(--sub);padding-top:4px}
.note .row{align-items:center}.note .row>span:first-child{flex:1;min-width:0}
.cnt{color:var(--bad);font-size:13px;font-weight:700;flex:none}
.empty{text-align:center;color:var(--sub);font-size:15px;margin-top:60px;line-height:1.6}.empty .ic{font-size:44px;margin-bottom:8px}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0 0}
.btn.danger{background:var(--bad);color:#fff}
.plain{margin:10px 0;padding-left:18px;line-height:1.8}
.doc{line-height:1.7;font-size:15px}.doc h3{font-size:16px;margin:22px 0 6px}.doc p{margin:6px 0}.doc ul{margin:6px 0;padding-left:20px}
.doc .contact{margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--line);font-weight:600}.doc a{color:var(--accent)}
.lvchip{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:6px 12px;font-family:inherit;font-size:13px;margin:-4px 0 0}
.lvchip b{color:var(--accent)}
.chip.lv{margin-left:6px;color:var(--accent);border-color:var(--accent);font-weight:700}
.lvtable{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.lvtable div{display:flex;flex-direction:column;align-items:center}.lvtable b{font-size:20px;color:var(--accent)}.lvtable span{font-size:12px;color:var(--sub)}
.opt.idk{border-style:dashed;color:var(--sub)}
.lvres{display:flex;align-items:baseline;gap:12px;margin:8px 0 16px}.lvres b{font-size:56px;font-weight:800;color:var(--accent);letter-spacing:-.02em}.lvres span{color:var(--sub);font-weight:600}
.lvbars .row{align-items:center}.lvbars .row>span:first-child{flex:0 0 96px;font-size:14px}
.lvbar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 10px}.lvbar i{display:block;height:100%;background:var(--accent)}
.pct{flex:0 0 40px;text-align:right;font-size:13px;color:var(--sub)}
.ck{display:flex;align-items:center;gap:12px;cursor:pointer}.ck input{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none}.ck span:nth-of-type(1){flex:1}
.sec small{font-weight:600;color:var(--accent)}
.decks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin:-12px 0 18px}
.deck{border:0;border-radius:10px;padding:9px 4px;background:transparent;color:var(--sub);font-family:inherit;font-weight:600;font-size:15px}
.deck small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
.deck.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat div{font-size:22px;font-weight:800} .stat span{font-size:12px;color:var(--sub)}
.kn{padding-top:6px;padding-bottom:6px}.kn .row{align-items:center}.kn .row>span:first-child{flex:1;min-width:0}
.kn .row span.tm{flex:none;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.toast{color:var(--bad);font-weight:600;text-align:center;margin-top:6px;min-height:22px}
/* 문제 화면: 스크롤 없이 한 화면에 고정. 화면이 작으면 t1→t2→t3 순서로 간격·글자를 줄임 */
#app.fit{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding-top:16px;padding-bottom:16px}
.fit .spacer{min-height:0}
.nextrow{position:relative;flex:none}
.nextrow .undo{position:absolute;left:0;right:0;top:10px;bottom:0;margin:0;z-index:2}
.fit.t1 .bar{margin-bottom:14px}.fit.t1 .word{margin:10px 0 6px}.fit.t1 .ipa{margin-bottom:8px}.fit.t1 .pos{margin-bottom:14px}
.fit.t1 .say{margin-top:8px}.fit.t1 .opt{padding:11px 14px;margin-bottom:8px}.fit.t1 .btn{padding:13px;margin-top:6px}
.fit.t1 .known{padding:10px;margin-top:2px}.fit.t1 .toast{margin-top:4px}
.fit.t2 .top{margin-bottom:6px}.fit.t2 .word{font-size:32px;margin:4px 0 4px}.fit.t2 .word.long{font-size:26px}.fit.t2 .word.xlong{font-size:21px}
.fit.t2 .ipa{font-size:14px;margin-bottom:6px}.fit.t2 .pos{margin-bottom:10px}.fit.t2 .say button{padding:5px 10px;font-size:13px}
.fit.t2 .opt{padding:8px 12px;margin-bottom:6px;font-size:15px;gap:10px}.fit.t2 .opt b{width:26px;height:26px;font-size:13px}
.fit.t2 .known{padding:8px;font-size:13px}.fit.t2 .toast{min-height:20px;font-size:14px}.fit.t2 .btn{padding:11px;font-size:16px}
.fit.t3 .bar{margin-bottom:8px}.fit.t3 .word{font-size:28px;margin:0 0 2px}.fit.t3 .ipa{margin-bottom:4px}.fit.t3 .pos{margin-bottom:6px}
.fit.t3 .say{margin-top:6px}.fit.t3 .opt{padding:6px 10px;margin-bottom:5px;font-size:14px}.fit.t3 .known{padding:6px;margin-top:0}
.fit.t3 .toast{margin-top:2px;min-height:18px}.fit.t3 .btn{padding:9px;margin-top:4px}
/* 문제 유형 */
.word.kor{font-size:30px;line-height:1.25}.word.kor.long{font-size:24px}.word.kor.xlong{font-size:20px}
.word.listen{margin-top:18px}
#bigsay{width:86px;height:86px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:38px;box-shadow:0 6px 18px rgba(47,91,234,.3)}
#bigsay:active{transform:scale(.95)}
.qhint{font-family:inherit}
.chip.qt{margin-right:6px;background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.opt:disabled{color:var(--ink);opacity:1}
.opt.en span{font-weight:700;letter-spacing:-.01em}
.spell{display:flex;gap:8px;margin:4px 0 6px}
.spell input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);letter-spacing:.02em}
.spell input:focus{outline:0;border-color:var(--accent)}
.spell input.ok{border-color:var(--ok);background:var(--okbg)}.spell input.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.spell .btn{width:auto;margin:0;padding:0 20px;flex:none}
.spans{text-align:center;font-size:18px;min-height:26px;margin-bottom:4px}.spans b{color:var(--ok);font-size:22px}
/* 예문 */
.ex{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:14px;line-height:1.4}
.ex b{color:var(--accent)}.ex small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.fit.t2 .ex{font-size:13px;padding:6px 10px;margin-top:4px}.fit.t4 .ex{display:none}.fit.t1 .word.listen{margin-top:6px}.fit.t2 #bigsay{width:64px;height:64px;font-size:28px}.fit.t3 #bigsay{width:50px;height:50px;font-size:22px}.fit.t3 .spell input{padding:8px;font-size:19px}.fit.t3 .spans{min-height:22px;font-size:16px}.fit.t4 .say{display:none}.fit.t3 .ex{font-size:12.5px;line-height:1.3}.fit.t3 .ex small{font-size:11.5px}
/* 복습 카드 */
.card.review{margin:-8px 0 16px}.card.review small{display:block;margin-top:2px;font-size:12px}
/* 검색 */
.search{width:100%;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card);color:var(--ink);margin-bottom:12px}
.search:focus{outline:0;border-color:var(--accent)}
.srl{padding:0 16px}.srow{border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.srow .row{border:0;align-items:center}.srow .row small{display:block;margin-top:2px;font-weight:400}
.srow .row>span:first-child{flex:1;min-width:0}
.kn-tag{display:inline!important;color:var(--ok);font-size:11px;font-weight:700}
.sdet{padding:0 0 14px}.sm{margin:6px 0}.sm .chip{margin-right:6px}.smean{font-size:17px;font-weight:600;margin:4px 0}
.sbtn{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sbtn button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" hidden>
  <button data-t="study"><i>📖</i>학습</button>
  <button data-t="wrong"><i>📝</i>오답노트</button>
  <button data-t="more"><i>☰</i>더보기</button>
</nav>
<script src="words.js"></script>
<script src="phrases.js"></script>
<script src="bsl.js"></script>
<script src="ngsl.js"></script>
<script src="cefr.js"></script>
<script src="ipa.js"></script>
<script src="levels.js"></script>
<script src="examples.js"></script>
<script>
// ---------- 데이터 ----------
const W = [], seen = new Set();
[['T', WORDS_RAW], ['P', PHRASES_RAW], ['B', BSL_RAW], ['G', NGSL_RAW], ['C', CEFR_RAW]].forEach(([d, raw]) => raw.trim().split('\n').forEach(l => {
  const [w, p, m] = l.split('|').map(s => s && s.trim());
  if (!w || !m || seen.has(w.toLowerCase())) return;
  seen.add(w.toLowerCase()); W.push({ w, p, m, d });
}));
// 단어장: 토익(TSL+숙어+비즈니스) / 기본(NGSL) / 전부
const DECKS = {
  toeic: { name: '토익', desc: '토익 단어 + 숙어 + 비즈니스 어휘', has: 'TPB' },

const IPA = {};
IPA_RAW.trim().split('\n').forEach(l => { const [w, us, uk] = l.split('|'); IPA[w] = [us, uk]; });
// 레벨(CEFR): A1 입문 ~ C2 최상급. v = 1 이면 공식 목록 기준(레벨 테스트 출제용), 0 이면 추정

const TYPES = [['명', '명사'], ['동', '동사'], ['형', '형용사'], ['부', '부사'], ['숙', '숙어']];
{ const LV = {}; LEVEL_RAW.trim().split('\n').forEach(l => { const [w, L, v] = l.split('|'); LV[w] = [L, v === '1']; });
  W.forEach(o => { const x = LV[o.w.toLowerCase()] || ['B1', false]; o.lv = x[0]; o.lvv = x[1]; }); }
const deckIdx = k => [...W.keys()].filter(i => DECKS[k].has.includes(W[i].d));

};
const ro = name => name + (name === 'Free' ? '로' : '으로');   // Basic으로 / Premium으로 / Free로
const PLAN_OF = a => a <= PLANS.free.max ? 'free' : a <= PLANS.basic.max ? 'basic' : 'premium';   // 이 학습량을 쓰려면 필요한 최소 등급
const AMT_MIN = 20, AMT_MAX = 100, AMT_STEP = 10;   // 하루 학습량: 20~100개, 10개 단위
const POS = { '명': '명사', '동': '동사', '형': '형용사', '부': '부사', '숙': '숙어' };

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

if (!ALL.known) ALL.known = {};                          // 아는 단어: { 'word': 표시한 시각 } → 앞으로 출제에서 제외
const keyOf = i => W[i].w.toLowerCase();
if (!ALL.wrongNote) ALL.wrongNote = {};                  // 오답노트: { 'word': { n: 틀린 횟수, t: 마지막으로 틀린 시각 } }

// 문제 유형: ek 영→한 · ke 한→영 · listen 듣고 고르기 · spell 스펠링 쓰기 (켜둔 것 중에서 섞어서 출제)
const QTYPES = [['ek', '영어 → 뜻', '단어를 보고 뜻 고르기'], ['ke', '뜻 → 영어', '뜻을 보고 영어 단어 고르기'], ['listen', '듣고 고르기', '발음만 듣고 뜻 고르기 (리스닝)'], ['spell', '스펠링 쓰기', '뜻을 보고 영어 단어 직접 입력 (숙어 제외)']];

// 복습 주기(망각곡선): { 'word': { b: 단계, due: 복습할 날(날짜 번호) } } — 맞히면 1→3→7→14→30→60일 뒤, 틀리면 다음 날부터 다시

// 새 Day를 만들 때 넣을 단어: 아는 단어 제외 + 선택한 레벨·유형만

const freshDeck = k => ({ day: 1, order: shuffle(deckIdx(k)), sess: null, history: [], days: [], done: {}, paused: {} });
function useDeck(k) {
  const n = deckIdx(k).length;

  const ids = deckIdx(k);
  if (cur && Array.isArray(cur.order) && cur.order.length < n && cur.order.every(i => i < W.length)) {
    // 단어가 새로 추가된 경우: 이미 만든 Day는 그대로 두고, 아직 안 나온 단어들 사이에 새 단어를 섞어 넣음
    const has = new Set(cur.order);

    const used = cur.ptr != null ? cur.ptr : last ? (last.ids ? last.end : last.start + last.count) : 0;
    const cut = Math.min(used, cur.order.length);
    cur.order = cur.order.slice(0, cut).concat(shuffle(cur.order.slice(cut).concat(ids.filter(i => !has.has(i)))));

  }
  if (!cur || !Array.isArray(cur.order) || cur.order.length !== n)
    cur = { ...freshDeck(k), day: (cur && cur.day) || 1, history: (cur && cur.history) || [] };
  // 이전 버전(하루 100개 고정) 진도 이어받기
  if (!cur.days) { cur.days = []; const old = Math.max(cur.day - 1, cur.sess ? cur.sess.day : 0); for (let i = 0; i < old; i++) cur.days.push({ start: i * 100, count: 100 }); }
  if (!cur.done) { cur.done = {}; (cur.history || []).forEach(x => cur.done[x.day] = true); }

}

// Day마다 단어 범위(시작 위치, 개수)를 처음 열 때 고정 → 학습량을 바꿔도 지난 Day는 그대로
// Day마다 단어 목록을 처음 열 때 고정 (아는 단어는 건너뛰고 학습량만큼 채움)
// → 학습량을 바꾸거나 아는 단어를 표시해도 지난 Day 구성은 그대로
const dayEnd = d => d.ids ? d.end : d.start + d.count;      // 이전 형식({start,count})도 지원
function ensureDays(n) {
  const L = S.order.length;
  if (S.ptr == null) S.ptr = S.days.length ? dayEnd(S.days[S.days.length - 1]) : 0;
  while (S.days.length < n) {
    const want = ALL.perDay || AMT_MIN, ids = [];
    // 아는 단어에서 되돌린 단어(이미 지나간 순서)는 다음 Day에 먼저 넣기
    while (ids.length < want && S.extra && S.extra.length) { const i = S.extra.shift(); if (!isKnown(i) && !ids.includes(i)) ids.push(i); }
    let p = S.ptr, guard = 0;
    while (ids.length < want && guard < L) { const i = S.order[p % L]; p++; guard++; if (wanted(i)) ids.push(i); }
    S.ptr = p; S.days.push({ ids, end: p });
  }
}
function dayWords(day) {
  ensureDays(day);
  const d = S.days[day - 1];
  const ids = d.ids || Array.from({ length: d.count }, (_, k) => S.order[(d.start + k) % S.order.length]);
  return ids.filter(i => !isKnown(i));
}
function totalDays() {
  const used = S.ptr != null ? S.ptr : S.days.reduce((a, d) => a + (d.count || d.ids.length), 0);
  return Math.max(S.days.length + Math.ceil(Math.max(0, S.order.length - used) / (ALL.perDay || AMT_MIN)), S.day);
}
// 학습량을 바꾸면, 아직 시작 안 한 Day 구성은 지워서 새 학습량으로 다시 잡히게
function trimDays() {
  for (const k in ALL.decks) {
    const d = ALL.decks[k]; if (!d.days) continue;
    let keep = 0;
    Object.keys(d.done || {}).forEach(x => keep = Math.max(keep, +x));
    Object.keys(d.paused || {}).forEach(x => keep = Math.max(keep, +x));
    if (d.sess) keep = Math.max(keep, d.sess.day);
    d.days.length = Math.min(d.days.length, keep);
    d.ptr = d.days.length ? dayEnd(d.days[d.days.length - 1]) : 0;
  }
}
// Basic은 하루에 Day 1개: 오늘 이미 Day를 끝냈으면 새 Day 시작 불가 (진행 중인 Day는 계속 가능)

// Day 이동 (진행 중이던 Day는 잠시 보관했다가 다시 오면 이어서)
function goDay(n) {
  if (S.sess && S.sess.day !== n) { S.paused[S.sess.day] = S.sess; S.sess = null; }
  if (!S.sess && S.paused[n]) { S.sess = S.paused[n]; delete S.paused[n]; }

}

// 오답 보기: 같은 품사에서, 정답과 뜻이 겹치지 않는 것으로 3개
// key = 'm' → 보기가 한글 뜻, 'w' → 보기가 영어 단어 (한→영 문제)
function makeChoices(idx, key = 'm') {
  const ans = W[idx], toks = new Set(ans.m.split(/,\s*/));
  const okDistractor = o => o.m !== ans.m && o.w.toLowerCase() !== ans.w.toLowerCase() && !o.m.split(/,\s*/).some(t => toks.has(t));
  // 단어·숙어를 섞어서 보기 구성: 숙어 문제는 전체에서, 단어 문제는 같은 품사 + 숙어에서
  // (한→영은 단어끼리·숙어끼리 비교되도록 같은 종류에서만)
  const same = o => key === 'w' ? (ans.p === '숙') === (o.p === '숙') && (ans.p === '숙' || o.p === ans.p) : (ans.p === '숙' || o.p === ans.p || o.p === '숙');
  let pool = shuffle(W.filter((o, k) => k !== idx && same(o) && okDistractor(o)));
  if (pool.length < 3) pool = pool.concat(shuffle(W.filter((o, k) => k !== idx && !same(o) && okDistractor(o))));
  const picks = [], used = new Set([ans[key]]);
  for (const o of pool) { if (!used.has(o[key])) { used.add(o[key]); picks.push(o[key]); } if (picks.length === 3) break; }
  const opts = shuffle([ans[key], ...picks]);
  return { opts, ans: opts.indexOf(ans[key]) };
}
// 이번 문제 유형 고르기: 켜둔 유형 중 무작위 (스펠링은 숙어·긴 단어 제외)
function pickType(idx, s) {
  if (s.prac === 'test') return 'ek';
  const ok = ALL.qtypes.filter(t => t !== 'spell' || (W[idx].p !== '숙' && W[idx].w.length <= 15 && /^[a-z-]+$/i.test(W[idx].w)));
  return ok.length ? ok[Math.random() * ok.length | 0] : 'ek';
}

// 앱에서는 폰의 TTS(Android 브리지), 브라우저 미리보기에서는 Web Speech API 사용
const speakText = text => text.replace(/\b[AB]\b/g, '').replace(/~/g, '').replace(/\s+/g, ' ').trim();

function webSpeak(t, langs) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  langs.forEach(lang => {
    const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-') === lang);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  });
}
// 한 가지 발음만

function home() {

// 레벨별 문제 수 (총 20): 쉬운 단어 → 어려운 단어 순서
const TEST_PLAN = { A1: 2, A2: 3, B1: 4, B2: 4, C1: 4, C2: 3 };
function levelTest(first) {
  const qs = [];
  LEVELS.forEach(l => {
    const pool = shuffle([...W.keys()].filter(i => W[i].lv === l && W[i].lvv && W[i].p !== '숙'));
    pool.slice(0, TEST_PLAN[l]).forEach(i => qs.push(i));
  });
  const t = { first, qs, pos: 0, res: [] };
  testQ(t);
}
function testQ(t) {
  if (t.pos >= t.qs.length) return testResult(t);
  const idx = t.qs[t.pos], w = W[idx], c = makeChoices(idx);
  fitOn = true;
  app.innerHTML = `
    <div class="top"><span>레벨 테스트</span><span>${t.pos + 1} / ${t.qs.length} <button class="x" id="x">✕</button></span></div>
    <div class="bar"><i style="width:${t.pos / t.qs.length * 100}%"></i></div>
    <div class="word${w.w.length > 13 ? ' long' : ''}">${esc(w.w)}</div>
    ${ipaHTML(w.w)}
    <div class="pos"><span class="chip">${POS[w.p] || w.p}</span></div>
    <div id="opts">${c.opts.map((m, i) => `<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(m)}</span></button>`).join('')}</div>
    <button class="opt idk" id="idk"><b>?</b><span>모르겠어요</span></button>
    <div class="spacer"></div>`;
  document.getElementById('x').onclick = () => t.first ? levelIntro(true) : moreView();
  const next = ok => { t.res.push({ lv: w.lv, ok }); t.pos++; testQ(t); };
  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => next(+b.dataset.i === c.ans));
  document.getElementById('idk').onclick = () => next(false);
}
function testResult(t) {
  // 레벨마다 60% 이상 맞히면 통과. 처음으로 통과 못 한 레벨부터 2단계를 공부 범위로 추천
  const rate = {}; LEVELS.forEach(l => { const r = t.res.filter(x => x.lv === l); rate[l] = r.length ? r.filter(x => x.ok).length / r.length : 0; });
  let f = LEVELS.findIndex(l => rate[l] < 0.6);
  const my = f === -1 ? 'C2' : f === 0 ? 'A1' : LEVELS[f - 1];
  if (f === -1) f = 4;
  const rec = LEVELS.slice(f, Math.min(f + 2, 6));
  const right = t.res.filter(x => x.ok).length;
  app.innerHTML = `
    <h1>레벨 테스트 결과</h1>
    <p class="muted">${right} / ${t.res.length} 정답</p>
    <div class="lvres"><b>${my}</b><span>${f === 0 && rate.A1 < 0.6 ? '입문 단계부터 시작해요' : LV_NAME[my] + ' 수준'}</span></div>
    <div class="card list lvbars">${LEVELS.map(l => `<div class="row"><span><b>${l}</b> ${LV_NAME[l]}</span>
      <span class="lvbar"><i style="width:${Math.round(rate[l] * 100)}%"></i></span><span class="pct">${Math.round(rate[l] * 100)}%</span></div>`).join('')}</div>
    <p class="muted">추천 학습 범위: <b>${rec.join(', ')}</b> (${rec.map(l => LV_NAME[l]).join('·')}) — 아직 헷갈리는 수준의 단어부터 공부해요.</p>
    <div class="spacer"></div>
    <button class="btn" id="ok">추천 레벨로 공부하기</button>
    <button class="btn ghost" id="custom">레벨 직접 고르기</button>`;
  const apply = () => { ALL.myLevel = my; ALL.levels = rec; trimDays(); save(); };
  document.getElementById('ok').onclick = () => { apply(); t.first ? amountView(true) : home(); };
  document.getElementById('custom').onclick = () => { apply(); filterView(t.first ? () => amountView(true) : home); };
}

// ---------- 하루 학습량 선택 (첫 실행 / 설정) ----------
function amountView(first) {
  const max = plan().max;

  const pct = v => (v - AMT_MIN) / (AMT_MAX - AMT_MIN) * 100;
  const ticks = [];
  for (let a = AMT_MIN; a <= AMT_MAX; a += AMT_STEP) ticks.push(a);
  app.innerHTML = `
    ${first ? `<h1>TOEIC 영단어</h1>` : `<div class="top"><span>하루 학습량</span><button class="x" id="x">✕</button></div>`}

        <i class="z free" style="left:0;width:${pct(PLANS.free.max)}%"></i>
        <i class="z basic" style="left:${pct(PLANS.free.max)}%;width:${pct(PLANS.basic.max) - pct(PLANS.free.max)}%"></i>
        <i class="z premium" style="left:${pct(PLANS.basic.max)}%;width:${100 - pct(PLANS.basic.max)}%"></i>
      </div>
      <input type="range" id="rng" min="${AMT_MIN}" max="${AMT_MAX}" step="1" value="${val}">
      <div class="ticks">${ticks.map(a => `<span style="left:${pct(a)}%">${a}</span>`).join('')}</div>
    </div>
    <div class="legend"><span><i class="z free"></i>Free ~${PLANS.free.max}</span><span><i class="z basic"></i>Basic ~${PLANS.basic.max}</span><span><i class="z premium"></i>Premium ~${PLANS.premium.max}</span></div>
    <div class="spacer"></div>
    <button class="btn" id="ok"></button>`;
  const rng = document.getElementById('rng'), av = document.getElementById('av'), at = document.getElementById('at'), ok = document.getElementById('ok');
  const snap = v => Math.round(v / AMT_STEP) * AMT_STEP;
  const show = () => {
    const raw = +rng.value; val = snap(raw);
    av.textContent = val;
    rng.style.setProperty('--p', pct(raw) + '%');
    const need = PLAN_OF(val);
    at.className = 'amttier ' + need;
    at.textContent = val > max ? `🔒 ${PLANS[need].name}${need === 'premium' ? '' : ' 이상'} 필요` : `${plan().name}에서 사용 가능`;
    ok.textContent = val > max ? `${ro(PLANS[need].name)} 업그레이드` : first ? `하루 ${val}개로 시작하기` : `하루 ${val}개로 저장`;
  };
  // 드래그하는 동안은 부드럽게 움직이고, 손을 떼면 10개 단위 눈금에 착 붙음
  rng.oninput = show;
  rng.onchange = () => { rng.value = snap(+rng.value); show(); };
  show();
  const x = document.getElementById('x'); if (x) x.onclick = moreView;
  ok.onclick = () => {
    if (val > plan().max) return planView({ want: val, first });
    setAmount(val); first ? home() : moreView();
  };
}
function setAmount(a) { ALL.perDay = Math.min(a, plan().max); trimDays(); save(); }

// ---------- 구독 플랜 ----------
// 플레이스토어 버전: Google Play 월 구독(AndroidBilling). 그 외(직접 설치한 테스트 APK·브라우저): 누르면 바로 전환
const BILL = window.AndroidBilling || null;
let PRICES = {}, planOpt = null, buying = null;
const RANK = { free: 0, basic: 1, premium: 2 };

// 등급이 바뀌면: 학습량을 새 등급 최대치 안으로
function setPlan(p) {
  ALL.plan = p;
  if (ALL.perDay != null && ALL.perDay > plan().max) setAmount(plan().max);
  save();
}

function planView(opt = {}) {

    if (k === cur) return BILL && k !== 'free' ? `<button class="btn ghost" data-m="1">구독 관리 · 해지 (Google Play)</button>` : '';

    if (!BILL) return `<button class="btn${k === 'premium' ? '' : ' ghost'}" data-p="${k}">${ro(PLANS[k].name)}${label}</button>`;
    if (k === 'free') return `<button class="btn ghost" data-m="1">Free로 변경 (Google Play에서 구독 해지)</button>`;
    const price = PRICES[k];
    return `<button class="btn${k === 'premium' ? '' : ' ghost'}" data-p="${k}"${price ? '' : ' disabled'}>${price ? `${ro(PLANS[k].name)}${label}` : '가격 불러오는 중…'}</button>`;
  };
  app.innerHTML = `
    <div class="top"><span>구독</span><button class="x" id="x">✕</button></div>

        <div class="plan-h"><b>${p.name}</b>${k === cur ? '<span class="chip">이용 중</span>' : BILL && PRICES[k] ? `<span class="muted" style="font-size:14px">월 ${PRICES[k]}</span>` : ''}</div>
        <ul>${p.perks.map(t => `<li>${t}</li>`).join('')}</ul>
        ${btn(k)}
      </div>`).join('')}
    ${BILL
      ? `<p class="muted" style="font-size:12px">구독은 Google Play 계정으로 결제되며 해지하기 전까지 매월 자동으로 갱신돼요. 해지는 Google Play → 결제 및 정기 결제에서 언제든 할 수 있고, 해지해도 이미 결제한 기간이 끝날 때까지는 계속 쓸 수 있어요. 등급을 바꾸면 남은 기간만큼 금액이 조정돼요.</p>
         <button class="link" id="restore" style="font-size:13px">구독 상태 다시 불러오기</button>`
      : `<p class="muted" style="font-size:12px">※ 테스트 버전이라 누르면 바로 바뀌어요.</p>`}
    <div class="spacer"></div>`;
  document.getElementById('x').onclick = () => { planOpt = null; opt.first ? amountView(true) : (opt.back || home)(); };
  document.querySelectorAll('.plan .btn[data-m]').forEach(b => b.onclick = () => BILL.manage());
  document.querySelectorAll('.plan .btn[data-p]').forEach(b => b.onclick = () => {

  const rs = document.getElementById('restore'); if (rs) rs.onclick = () => { BILL.refresh(); rs.textContent = '불러오는 중…'; };

}

// 등급 변경이 끝난 뒤 (구독 결제 완료 포함): 원래 하려던 학습량 적용 후 이전 화면으로
function planDone(k, opt) {
  planOpt = null;
  setPlan(k);
  if (opt.want && opt.want <= plan().max) setAmount(opt.want);
  (opt.back || home)();
}

// ---- Google Play 결제 결과 (BillingBridge.java에서 호출) ----
window.onBillingProducts = json => {
  try { PRICES = JSON.parse(json) || {}; } catch (e) { PRICES = {}; }
  if (planOpt) planView(planOpt);
};
window.onBillingPlan = p => {
  if (!PLANS[p]) return;
  const changed = p !== ALL.plan;
  if (buying && p === buying.plan) { const b = buying; buying = null; return planDone(p, b.opt); }   // 방금 결제한 등급이 반영됨
  if (!changed) { if (planOpt) planView(planOpt); return; }
  setPlan(p);
  if (planOpt) return planView(planOpt);
  // 구독이 끝났거나 다른 기기에서 바꾼 경우: 지금 화면의 등급 표시만 갱신 (문제 푸는 중이면 그대로 둠)
  const on = tabs.hidden ? null : tabs.querySelector('.on');
  if (on && on.dataset.t === 'study') home();
  else if (on && on.dataset.t === 'more') moreView();
};
window.onBillingResult = code => {
  if (code === 'cancel') { buying = null; return; }
  const msg = { pending: '결제가 아직 처리 중이에요. 완료되면 자동으로 적용돼요.',
                noproduct: '구독 상품을 불러오지 못했어요. 잠시 후 다시 시도해주세요.',
                unavailable: 'Google Play 결제에 연결하지 못했어요. Play 스토어 로그인과 인터넷 연결을 확인해주세요.',
                error: '결제를 진행하지 못했어요. 잠시 후 다시 시도해주세요.' }[code];
  if (code !== 'pending') buying = null;
  if (msg && (planOpt || code === 'pending')) alert(msg);
};
// 앱을 켤 때 · 다시 돌아올 때 구독 상태 확인 (해지·만료·다른 기기 변경 반영)
if (BILL) {
  BILL.refresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) BILL.refresh(); });
}

// 아는 단어 목록 (되돌리면 다시 출제됨)
function knownView() {
  const byKey = {}; W.forEach((o, i) => byKey[o.w.toLowerCase()] = i);
  const list = Object.entries(ALL.known).sort((a, b) => b[1] - a[1]).filter(([k]) => byKey[k] != null);
  // 누른 날짜별로 묶기 (최근 날짜가 위)
  const p2 = n => String(n).padStart(2, '0');

function result() {
  const s = S.sess, total = s.queue.length, wrongN = s.wrong.length, right = total - wrongN;
  if (s.round === 1 && s.firstScore == null) { s.firstScore = right; save(); }
  const redo = wrongN && plan().redo;     // Free: 오답은 목록만 보고, 다시 풀기 없이 완료
  app.innerHTML = `
    <h1>Day ${s.day} · ${s.round === 1 ? '본 학습 결과' : '오답 ' + s.round + '회차 결과'}</h1>
    <p class="muted">맞힌 개수</p>
    <p class="score">${right}<small> / ${total}</small></p>
    ${wrongN ? `<p class="muted">${redo ? `틀린 ${wrongN}개를 다시 풀어요.` : `틀린 ${wrongN}개예요. 뜻을 확인해두세요.`}</p>
      <div class="card list">${s.wrong.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>`
      : `<p class="muted">${s.round === 1 ? '한 번에 다 맞혔어요! 🎉' : '오답까지 전부 맞혔어요! 🎉'}</p>`}
    <div class="spacer"></div>
    ${redo ? `<button class="btn" id="go">오답 다시 풀기 (${wrongN}개)</button>`
           : `${wrongN ? lockBtn('up', '오답 다시 풀기는 Basic부터') : ''}<button class="btn" id="go">완료${plan().oneDay ? '' : ' · 다음 Day로'}</button>`}`;
  const up = document.getElementById('up'); if (up) up.onclick = () => planView();
  document.getElementById('go').onclick = () => {
    if (redo) {
      Object.assign(s, { round: s.round + 1, queue: shuffle([...s.wrong]), pos: 0, wrong: [], cur: null, picked: null });
      save(); quiz();
    } else {
      S.history.push({ day: s.day, date: today(), first: s.firstScore, total: dayWords(s.day).length, rounds: s.round });
      S.done[s.day] = true; ALL.lastMainDate = today(); S.sess = null;
      let nx = s.day + 1; while (S.done[nx]) nx++;
      goDay(nx); save(); home();
      adInterstitial();          // Free·Basic: 하루치가 끝나면 전면 광고
    }
  };
}

// 단어 검색: 영어(앞부분부터) 또는 한글 뜻으로
const SRC_NAME = { T: '토익', P: '토익 숙어', B: '비즈니스', G: '기본', C: '기본' };
let searchQ = '';
function searchView(back = home) {
  app.innerHTML = `
    <div class="top"><span>단어 검색</span><button class="x" id="x">✕</button></div>
    <input class="search" id="q" type="search" placeholder="영어 단어나 한글 뜻으로 검색" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(searchQ)}">
    <div id="sres"></div>
    <div class="spacer"></div>`;
  document.getElementById('x').onclick = back;
  const q = document.getElementById('q'), box = document.getElementById('sres');
  let open = null;
  const detail = i => {
    const w = W[i], k = keyOf(i), ex = EX[k], ipa = IPA[k] && IPA[k][0];
    const sr = ALL.srs[k];
    return `<div class="sdet">
      ${ipa ? `<div class="muted">/${esc(ipa)}/</div>` : ''}
      <div class="sm"><span class="chip">${POS[w.p] || w.p}</span><span class="chip lv">${w.lv}</span><span class="chip">${SRC_NAME[w.d]}</span></div>
      ${ex ? `<div class="ex"><div>${exHTML(ex[0], w.w)}</div><small>${esc(ex[1])}</small></div>` : ''}
      ${ALL.wrongNote[k] ? `<p class="muted" style="margin:6px 0 0">오답노트 ✕${ALL.wrongNote[k].n}</p>` : ''}
      ${sr && !isKnown(i) ? `<p class="muted" style="margin:4px 0 0">다음 복습: ${sr.due <= dayNo() ? '오늘' : (sr.due - dayNo()) + '일 뒤'}</p>` : ''}
      <div class="sbtn"><button data-a="us">🔊 미국</button><button data-a="uk">🔊 영국</button>
        <button data-act="known">${isKnown(i) ? '아는 단어 해제' : '✓ 아는 단어'}</button>
        <button data-act="note">${ALL.wrongNote[k] ? '오답노트에서 빼기' : '+ 오답노트'}</button></div></div>`;
  };
  const render = () => {
    const v = q.value.trim().toLowerCase(); searchQ = q.value;
    if (!v) { box.innerHTML = `<p class="muted" style="text-align:center;margin-top:40px">예) negotiate · 회의 · fill out</p>`; return; }
    let hits;
    if (/[가-힣]/.test(v)) hits = [...W.keys()].filter(i => W[i].m.includes(v));
    else {
      const a = [], b = [];
      W.forEach((o, i) => { const lw = o.w.toLowerCase(); if (lw.startsWith(v)) a.push(i); else if (lw.includes(v)) b.push(i); });
      a.sort((x, y) => W[x].w.length - W[y].w.length);
      hits = a.concat(b);
    }
    const more = hits.length > 50; hits = hits.slice(0, 50);
    box.innerHTML = hits.length ? `<div class="card list srl">${hits.map(i => `<div class="srow" data-i="${i}">
        <button class="row rowbtn"><span><b>${esc(W[i].w)}</b>${isKnown(i) ? ' <small class="kn-tag">아는 단어</small>' : ''}<small class="muted">${esc(W[i].m)}</small></span><span>${open === i ? '⌃' : '⌄'}</span></button>
        ${open === i ? detail(i) : ''}</div>`).join('')}</div>${more ? `<p class="muted" style="text-align:center">앞의 50개만 보여요. 더 길게 입력해보세요.</p>` : ''}`
      : `<p class="muted" style="text-align:center;margin-top:40px">찾는 단어가 없어요.</p>`;
    box.querySelectorAll('.srow').forEach(r => {
      const i = +r.dataset.i;
      r.querySelector('.rowbtn').onclick = () => { open = open === i ? null : i; render(); };
      r.querySelectorAll('[data-a]').forEach(b => b.onclick = () => say(W[i].w, b.dataset.a));
      r.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
        const k = keyOf(i);
        if (b.dataset.act === 'known') { if (isKnown(i)) unknow(i); else { ALL.known[k] = Date.now(); delete ALL.srs[k]; } }
        else { if (ALL.wrongNote[k]) delete ALL.wrongNote[k]; else ALL.wrongNote[k] = { n: 0, t: Date.now() }; }
        save(); render();
      });
    });
  };
  q.oninput = () => { open = null; render(); };
  render();
  if (!searchQ) q.focus();
}

function backupView(msg) {
  const last = ALL.lastBackup ? new Date(ALL.lastBackup) : null;
  app.innerHTML = `

    <div class="card">
      <b>백업 파일 저장</b>

  document.getElementById('x').onclick = moreView;
  document.getElementById('save').onclick = () => {
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const name = `토익단어_백업_${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}.json`;
    const text = JSON.stringify({ app: 'toeicvoca', ver: 1, at: Date.now(), data: { ...ALL, lastBackup: Date.now() } });
    if (window.AndroidApp && AndroidApp.saveBackup) { AndroidApp.saveBackup(name, text); return; }   // 결과는 onBackupSaved로
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    window.onBackupSaved(true);
  };
  document.getElementById('load').onclick = () => {
    if (window.AndroidApp && AndroidApp.openBackup) { AndroidApp.openBackup(); return; }   // 결과는 onBackupLoaded로
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => window.onBackupLoaded(r.result); r.readAsText(f); };
    inp.click();
  };
}
// 앱(안드로이드)에서 파일 저장/열기가 끝나면 호출
window.onBackupSaved = ok => {
  if (ok) { ALL.lastBackup = Date.now(); save(); }
  backupView(ok ? '백업 파일을 저장했어요.' : '저장하지 못했어요. 다시 시도해주세요.');
};
window.onBackupLoaded = text => {
  if (text == null) return backupView();   // 선택 취소
  let b;
  try { b = JSON.parse(text); } catch (e) { b = null; }
  if (!b || b.app !== 'toeicvoca' || !b.data || !b.data.decks) return backupView('토익 단어 백업 파일이 아니에요. 다른 파일을 골라주세요.');
  const d = new Date(b.at);
  if (!confirm(`${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}에 만든 백업으로 바꿀까요?\n지금 폰의 학습 기록은 이 파일 내용으로 바뀌어요.`)) return backupView();
  b.data.plan = ALL.plan;   // 멤버십은 백업 파일이 아니라 지금 폰의 구독을 따름
  try { localStorage.setItem(KEY, JSON.stringify(b.data)); } catch (e) { return backupView('불러오지 못했어요.'); }
  location.reload();
};

// 푸시 알림
function pushView(msg) {
  const P = ALL.push;
  const items = [['notice', '공지사항', '서비스 공지와 안내'], ['update', '업데이트', '새 기능과 단어 업데이트 소식'], ['event', '이벤트', '할인·프로모션 소식'], ['daily', '일일 학습 알림', '매일 정한 시간에 학습 알림']];
  app.innerHTML = `
    <div class="top"><span>푸시 알림</span><button class="x" id="x">✕</button></div>
    <div class="card list menu">
      ${items.map(([k, t, d]) => `<div class="row"><span>${t}<small class="muted">${d}</small></span>${toggle('p-' + k, P[k])}</div>`).join('')}
      ${P.daily ? `<div class="row"><span>알림 시간<small class="muted">24시간 기준 · 휴대폰 시간에 맞춰 알림</small></span>
        <span class="tin"><input id="p-h" inputmode="numeric" maxlength="2" value="${P.time.split(':')[0]}">:<input id="p-m" inputmode="numeric" maxlength="2" value="${P.time.split(':')[1]}"><button class="mini" id="p-save">저장</button></span></div>` : ''}
    </div>
    ${msg ? `<p class="info">${esc(msg)}</p>` : ''}
    <p class="muted" style="font-size:12px">※ 공지사항·업데이트·이벤트 알림은 앱 정식 출시 후 발송돼요. 일일 학습 알림은 지금 바로 동작해요.</p>
    <div class="spacer"></div>`;
  document.getElementById('x').onclick = moreView;
  items.forEach(([k]) => document.getElementById('p-' + k).onclick = () => {
    P[k] = !P[k]; save();
    if (k === 'daily') return pushView(applyDaily());
    pushView();
  });
  const sv = document.getElementById('p-save');
  if (sv) {
    const hi = document.getElementById('p-h'), mi = document.getElementById('p-m');
    [hi, mi].forEach(el => { el.oninput = () => el.value = el.value.replace(/\D/g, '').slice(0, 2); el.onfocus = () => el.select(); });
    hi.oninput = () => { hi.value = hi.value.replace(/\D/g, '').slice(0, 2); if (hi.value.length === 2) mi.focus(); };
    sv.onclick = () => {
      const hh = parseInt(hi.value, 10), mm = parseInt(mi.value || '0', 10);
      if (isNaN(hh) || hh < 0 || hh > 23 || isNaN(mm) || mm < 0 || mm > 59) return pushView('시간은 0~23시, 분은 0~59분으로 입력해주세요.');
      P.time = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); save(); pushView(applyDaily());
    };
  }
}
// 일일 학습 알림을 폰에 예약 (앱에서만)
function applyDaily() {
  const P = ALL.push, [hh, mm] = P.time.split(':').map(Number);
  if (window.AndroidApp && AndroidApp.setDailyReminder) {
    const ok = AndroidApp.setDailyReminder(P.daily, hh, mm);
    if (P.daily && !ok) return '알림 권한을 허용해야 알림이 와요. 휴대폰 설정 → 앱 → 토익 단어 → 알림에서 켤 수 있어요.';
    return P.daily ? `매일 ${P.time}에 알려드릴게요.` : '';
  }
  return P.daily ? '(웹 미리보기에서는 알림이 오지 않아요)' : '';
}
