<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOEIC 단어</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1c1c1f;--sub:#707078;--line:#e2e0d8;--accent:#2f5bea;--accentInk:#fff;
--ok:#16894a;--okbg:#e3f5ea;--bad:#cf3b3b;--badbg:#fbe8e8}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d21;--ink:#f1f1f3;--sub:#9a9aa3;--line:#2d2d33;
--accent:#6f8dff;--accentInk:#0d0d10;--ok:#43d184;--okbg:#14301f;--bad:#ff6e6e;--badbg:#3a1a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 28px;display:flex;flex-direction:column}
h1{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 28px;letter-spacing:.02em}
.day{font-size:52px;font-weight:800;letter-spacing:-.03em;margin:0}
.muted{color:var(--sub);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;
background:var(--accent);color:var(--accentInk);margin-top:10px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.spacer{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:10px}
.x{background:none;border:0;color:var(--sub);font-size:22px;padding:4px 8px;margin:-4px -8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.word.long{font-size:30px}.word.xlong{font-size:24px}
.word{font-size:40px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:28px 0 8px;word-break:break-word}
.pos{text-align:center;margin-bottom:26px}
.say{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.say button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font:600 14px inherit;font-family:inherit}
.say button:active{transform:scale(.96)}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);
border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:10px;font-size:17px;font-family:inherit}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--bg);color:var(--sub)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad b{background:var(--bad);color:#fff}
.score{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.score small{font-size:22px;color:var(--sub);font-weight:600}
.list{margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row span:last-child{color:var(--sub);text-align:right}
.decks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin:-12px 0 18px}
.deck{border:0;border-radius:10px;padding:9px 4px;background:transparent;color:var(--sub);font:600 15px/1.2 inherit;font-family:inherit}
.deck small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
.deck.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat div{font-size:22px;font-weight:800} .stat span{font-size:12px;color:var(--sub)}
.toast{color:var(--bad);font-weight:600;text-align:center;margin-top:6px;min-height:22px}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script src="phrases.js"></script>
<script src="bsl.js"></script>
<script src="ngsl.js"></script>
<script>
// ---------- 데이터 ----------
const W = [], seen = new Set();
[['T', WORDS_RAW], ['P', PHRASES_RAW], ['B', BSL_RAW], ['G', NGSL_RAW]].forEach(([d, raw]) => raw.trim().split('\n').forEach(l => {
  const [w, p, m] = l.split('|').map(s => s && s.trim());
  if (!w || !m || seen.has(w.toLowerCase())) return;
  seen.add(w.toLowerCase()); W.push({ w, p, m, d });
}));
// 단어장: 토익(TSL+숙어+비즈니스) / 기본(NGSL) / 전부
const DECKS = {
  toeic: { name: '토익', desc: '토익 단어 + 숙어 + 비즈니스 어휘', has: 'TPB' },
  basic: { name: '기본', desc: '일반 영어 핵심 단어 (NGSL)', has: 'G' },
  all:   { name: '전부', desc: '모든 단어와 숙어', has: 'TPBG' },
};
const deckIdx = k => [...W.keys()].filter(i => DECKS[k].has.includes(W[i].d));
const PER_DAY = 100, KEY = 'toeic_voca_decks_v1';
const POS = { '명': '명사', '동': '동사', '형': '형용사', '부': '부사', '숙': '숙어' };

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

let ALL, S;
try { ALL = JSON.parse(localStorage.getItem(KEY)); } catch (e) { ALL = null; }
if (!ALL || !ALL.decks) ALL = { deck: 'toeic', decks: {} };
const freshDeck = k => ({ day: 1, order: shuffle(deckIdx(k)), sess: null, history: [] });
function useDeck(k) {
  const n = deckIdx(k).length, cur = ALL.decks[k];
  if (!cur || !Array.isArray(cur.order) || cur.order.length !== n)
    ALL.decks[k] = { ...freshDeck(k), day: (cur && cur.day) || 1, history: (cur && cur.history) || [] };
  ALL.deck = k; S = ALL.decks[k];
}
useDeck(DECKS[ALL.deck] ? ALL.deck : 'toeic');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ALL)); } catch (e) {} };
save();

function dayWords(day) {
  const totalDays = Math.ceil(S.order.length / PER_DAY);
  const i = (day - 1) % totalDays;
  return S.order.slice(i * PER_DAY, i * PER_DAY + PER_DAY);
}

// 오답 보기: 같은 품사에서, 정답과 뜻이 겹치지 않는 것으로 3개
function makeChoices(idx) {
  const ans = W[idx], toks = new Set(ans.m.split(/,\s*/));
  const okDistractor = o => o.m !== ans.m && !o.m.split(/,\s*/).some(t => toks.has(t));
  // 단어·숙어를 섞어서 보기 구성: 숙어 문제는 전체에서, 단어 문제는 같은 품사 + 숙어에서
  let pool = shuffle(W.filter((o, k) => k !== idx && (ans.p === '숙' || o.p === ans.p || o.p === '숙') && okDistractor(o)));
  if (pool.length < 3) pool = pool.concat(shuffle(W.filter((o, k) => k !== idx && o.p !== ans.p && okDistractor(o))));
  const picks = [], used = new Set();
  for (const o of pool) { if (!used.has(o.m)) { used.add(o.m); picks.push(o.m); } if (picks.length === 3) break; }
  const opts = shuffle([ans.m, ...picks]);
  return { opts, ans: opts.indexOf(ans.m) };
}

// ---------- 발음 ----------
// 앱에서는 폰의 TTS(Android 브리지), 브라우저 미리보기에서는 Web Speech API 사용
const speakText = text => text.replace(/\b[AB]\b/g, '').replace(/~/g, '').replace(/\s+/g, ' ').trim();
function sayMsg(m) {
  const el = document.getElementById('toast');
  if (el) { el.textContent = m; setTimeout(() => { if (el.textContent === m) el.textContent = ''; }, 3000); }
}
function webSpeak(t, langs) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  langs.forEach(lang => {
    const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-') === lang);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  });
}
// 한 가지 발음만
function say(text, acc) {
  const t = speakText(text);
  if (window.Android && Android.speak) {
    const r = Android.speak(t, acc);
    if (r === -100) sayMsg('음성 준비 중이에요. 잠시 후 다시 눌러주세요.');
    else if (r < 0) sayMsg((acc === 'uk' ? '영국' : '미국') + ' 영어 음성이 없어요. 설정 → 텍스트 음성 변환에서 음성 데이터를 받아주세요.');
    return;
  }
  webSpeak(t, [acc === 'uk' ? 'en-GB' : 'en-US']);
}
// 미국 → 영국 순서로 (문제 나올 때 자동, 다시 듣기 버튼)
let sayTimer = null;
function sayBoth(text, tries = 0) {
  clearTimeout(sayTimer);
  const t = speakText(text);
  if (window.Android && Android.speakBoth) {
    const r = Android.speakBoth(t);
    if (r === -100 && tries < 10) sayTimer = setTimeout(() => sayBoth(text, tries + 1), 300);   // 앱 시작 직후 엔진 준비 대기
    else if (r === -2) sayMsg('영국 영어 음성이 없어 미국 발음만 나와요. 설정 → 텍스트 음성 변환에서 받을 수 있어요.');
    else if (r === -1) sayMsg('영어 음성이 없어요. 설정 → 텍스트 음성 변환에서 음성 데이터를 받아주세요.');
    return;
  }
  webSpeak(t, ['en-US', 'en-GB']);
}
function sayStop() {
  clearTimeout(sayTimer);
  if (window.Android && Android.stop) Android.stop();
  else if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// ---------- 화면 ----------
const app = document.getElementById('app');

function home() {
  const s = S.sess, n = dayWords(S.day).length;
  const done = S.history.length;
  const avg = done ? Math.round(S.history.reduce((a, h) => a + h.first / h.total * 100, 0) / done) : 0;
  const lastDate = S.history.length ? S.history[S.history.length - 1].date : '';
  const resume = s && s.day === S.day;
  const rDay = resume ? S.day : (S.history.length ? S.history[S.history.length - 1].day : null);
  app.innerHTML = `
    <h1>TOEIC 영단어</h1>
    <div class="decks">${Object.entries(DECKS).map(([k, d]) => `<button class="deck${k === ALL.deck ? ' on' : ''}" data-k="${k}">${d.name}</button>`).join('')}</div>
    <p class="muted">${DECKS[ALL.deck].desc}</p>
    <p class="day">Day ${S.day}</p>
    <p class="muted">${n}단어 · 4지선다 · 틀린 단어는 다 맞출 때까지 반복</p>
    <div class="stats">
      <div class="stat"><div>${done}</div><span>완료한 날</span></div>
      <div class="stat"><div>${done ? avg + '%' : '–'}</div><span>평균 첫 정답률</span></div>
    </div>
    ${lastDate === today() ? `<p class="muted">오늘 이미 하루치를 끝냈어요. 더 해도 돼요 💪</p>` : ''}
    <div class="spacer"></div>
    ${rDay ? `<button class="btn ghost" id="rt">Day ${rDay} 단어 다시 테스트 (순서 섞기)</button>` : ''}
    ${resume && s.wrong.length ? `<button class="btn ghost" id="wv">지금까지 틀린 ${s.wrong.length}개 보기</button>` : ''}
    ${resume ? `<button class="btn" id="go">이어하기 · ${s.round === 1 ? '' : '오답 ' + s.round + '회차 · '}${s.pos}/${s.queue.length}</button>`
             : `<button class="btn" id="go">시작하기</button>`}
    <button class="btn ghost" id="hist">기록 보기</button>
    <p class="muted" style="font-size:11px;text-align:center;margin-top:14px">단어 목록: TSL · BSL · NGSL (Browne, Culligan &amp; Phillips) · CC BY-SA 4.0</p>`;
  document.querySelectorAll('.deck').forEach(b => b.onclick = () => { useDeck(b.dataset.k); save(); home(); });
  document.getElementById('go').onclick = () => { if (!resume) startDay(); quiz(); };
  document.getElementById('hist').onclick = history;
  const wv = document.getElementById('wv');
  if (wv) wv.onclick = wrongView;
  const rt = document.getElementById('rt');
  if (rt) rt.onclick = () => startPrac('all', rDay, dayWords(rDay));
}

// 연습 모드(진도·기록에 영향 없음): 'all' = 그 Day 단어 전체 다시 테스트, 'wrong' = 지금까지 틀린 단어
function startPrac(kind, day, items) {
  quiz({ prac: kind, day, items: [...items], round: 0, queue: shuffle([...items]), pos: 0, wrong: [], cur: null, picked: null });
}

// 중간 오답 보기: 진도에는 영향 없음 (오답들은 그대로 회차 끝 복습에도 다시 나옴)
function wrongView() {
  const list = S.sess.wrong;
  app.innerHTML = `
    <div class="top"><span>Day ${S.sess.day} · 지금까지 틀린 ${list.length}개</span><button class="x" id="x">✕</button></div>
    <div class="card list">${list.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>
    <div class="spacer"></div>
    <button class="btn" id="go">이 단어들 풀어보기</button>
    <button class="btn ghost" id="back">돌아가기</button>`;
  document.getElementById('x').onclick = home;
  document.getElementById('back').onclick = home;
  document.getElementById('go').onclick = () => startPrac('wrong', S.sess.day, list);
}

function startDay() {
  S.sess = { day: S.day, round: 1, queue: shuffle(dayWords(S.day)), pos: 0, wrong: [], firstScore: null, cur: null, picked: null };
  save();
}

let active = null;
function quiz(s = S.sess) {
  active = s;
  const persist = () => { if (!s.prac) save(); };
  if (s.pos >= s.queue.length) return s.prac ? pracResult(s) : result();
  const idx = s.queue[s.pos], w = W[idx];
  if (!s.cur || s.cur.idx !== idx) { s.cur = { idx, ...makeChoices(idx) }; s.picked = null; persist(); }
  const c = s.cur;
  app.innerHTML = `
    <div class="top"><span>Day ${s.day} · ${s.prac === 'all' ? '다시 테스트' : s.prac ? '오답 미리 풀기' : s.round === 1 ? '본 학습' : '오답 ' + s.round + '회차'}</span>
      <span>${s.pos + 1} / ${s.queue.length} <button class="x" id="x">✕</button></span></div>
    <div class="bar"><i style="width:${s.pos / s.queue.length * 100}%"></i></div>
    <div class="word${w.w.length > 22 ? ' xlong' : w.w.length > 13 ? ' long' : ''}">${esc(w.w)}</div>
    <div class="pos"><span class="chip">${POS[w.p] || w.p}</span>
      <div class="say"><button id="replay">🔁 다시 듣기</button><button data-a="us">🔊 미국</button><button data-a="uk">🔊 영국</button></div></div>
    <div id="opts">${c.opts.map((m, i) => `<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(m)}</span></button>`).join('')}</div>
    <div class="toast" id="toast"></div>
    <div class="spacer"></div>
    <button class="btn" id="next" style="visibility:hidden">다음 →</button>`;
  document.getElementById('x').onclick = () => { active = null; sayStop(); home(); };
  document.querySelectorAll('.say button[data-a]').forEach(b => b.onclick = () => say(w.w, b.dataset.a));
  document.getElementById('replay').onclick = () => sayBoth(w.w);
  if (s.picked == null) sayBoth(w.w);   // 새 문제가 나오면 미국 → 영국 순서로 자동 재생
  const btns = [...document.querySelectorAll('.opt')];
  const next = document.getElementById('next');
  const advance = () => { s.pos++; s.cur = null; s.picked = null; persist(); quiz(s); };
  next.onclick = advance;
  const reveal = (pick, auto) => {
    btns[c.ans].classList.add('ok');
    if (pick !== c.ans) { btns[pick].classList.add('bad'); document.getElementById('toast').textContent = '오답 — 정답: ' + 'ABCD'[c.ans]; }
    next.style.visibility = 'visible';
    if (pick === c.ans && auto) setTimeout(() => { if (active === s && s.cur === c) advance(); }, 550);
  };
  if (s.picked != null) reveal(s.picked, false);   // 앱을 껐다 켰을 때 답 고른 상태 복원
  btns.forEach(b => b.onclick = () => {
    if (s.picked != null) return;
    const pick = +b.dataset.i;
    s.picked = pick;
    if (pick !== c.ans && !s.wrong.includes(idx)) s.wrong.push(idx);
    persist();
    reveal(pick, true);
  });
}

function pracResult(s) {
  active = null;
  const total = s.queue.length, right = total - s.wrong.length;
  const resume = S.sess && S.sess.day === S.day;
  app.innerHTML = `
    <h1>Day ${s.day} · ${s.prac === 'all' ? '다시 테스트' : '오답 미리 풀기'} 결과</h1>
    <p class="muted">맞힌 개수</p>
    <p class="score">${right}<small> / ${total}</small></p>
    <p class="muted">${s.wrong.length ? '아직 헷갈리는 단어예요.' : '다 맞혔어요! 👍'} 연습이라 진도·기록에는 영향이 없어요.</p>
    ${s.wrong.length ? `<div class="card list">${s.wrong.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>` : ''}
    <div class="spacer"></div>
    <button class="btn" id="again">한 번 더 (순서 섞어서)</button>
    ${s.wrong.length && s.wrong.length < total ? `<button class="btn ghost" id="wrongonly">틀린 ${s.wrong.length}개만 다시</button>` : ''}
    ${resume ? `<button class="btn ghost" id="go">본 학습 이어하기</button>` : ''}
    <button class="btn ghost" id="back">홈으로</button>`;
  document.getElementById('again').onclick = () => startPrac(s.prac, s.day, s.items);
  const wo = document.getElementById('wrongonly');
  if (wo) wo.onclick = () => startPrac('wrong', s.day, s.wrong);
  const go = document.getElementById('go');
  if (go) go.onclick = () => quiz();
  document.getElementById('back').onclick = home;
}

function result() {
  const s = S.sess, total = s.queue.length, wrongN = s.wrong.length, right = total - wrongN;
  if (s.round === 1 && s.firstScore == null) { s.firstScore = right; save(); }
  app.innerHTML = `
    <h1>Day ${s.day} · ${s.round === 1 ? '본 학습 결과' : '오답 ' + s.round + '회차 결과'}</h1>
    <p class="muted">맞힌 개수</p>
    <p class="score">${right}<small> / ${total}</small></p>
    ${wrongN ? `<p class="muted">틀린 ${wrongN}개를 다시 풀어요.</p>
      <div class="card list">${s.wrong.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>`
      : `<p class="muted">${s.round === 1 ? '한 번에 다 맞혔어요! 🎉' : '오답까지 전부 맞혔어요! 🎉'}</p>`}
    <div class="spacer"></div>
    ${wrongN ? `<button class="btn" id="go">오답 다시 풀기 (${wrongN}개)</button>`
             : `<button class="btn" id="go">완료 · Day ${s.day + 1}로</button>`}`;
  document.getElementById('go').onclick = () => {
    if (wrongN) {
      Object.assign(s, { round: s.round + 1, queue: shuffle([...s.wrong]), pos: 0, wrong: [], cur: null, picked: null });
      save(); quiz();
    } else {
      S.history.push({ day: s.day, date: today(), first: s.firstScore, total: dayWords(s.day).length, rounds: s.round });
      S.day++; S.sess = null; save(); home();
    }
  };
}

function history() {
  const h = [...S.history].reverse();
  app.innerHTML = `
    <div class="top"><span>학습 기록 · ${DECKS[ALL.deck].name}</span><button class="x" id="x">✕</button></div>
    ${h.length ? `<div class="card list">${h.map(x => `<div class="row"><span><b>Day ${x.day}</b> · ${x.date}</span>
      <span>첫 정답 ${x.first}/${x.total} · ${x.rounds}회차</span></div>`).join('')}</div>`
      : `<p class="muted">아직 기록이 없어요.</p>`}
    <div class="spacer"></div>
    <button class="btn ghost" id="reset">이 단어장 초기화</button>`;
  document.getElementById('x').onclick = home;
  document.getElementById('reset').onclick = () => {
    if (confirm(`'${DECKS[ALL.deck].name}' 단어장의 진도와 기록을 지울까요?`)) { ALL.decks[ALL.deck] = freshDeck(ALL.deck); S = ALL.decks[ALL.deck]; save(); home(); }
  };
}

home();
</script>
</body>
</html>
