<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TOEIC 단어</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1c1c1f;--sub:#707078;--line:#e2e0d8;--accent:#2f5bea;--accentInk:#fff;
--ok:#16894a;--okbg:#e3f5ea;--bad:#cf3b3b;--badbg:#fbe8e8}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d21;--ink:#f1f1f3;--sub:#9a9aa3;--line:#2d2d33;
--accent:#6f8dff;--accentInk:#0d0d10;--ok:#43d184;--okbg:#14301f;--bad:#ff6e6e;--badbg:#3a1a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 16px 28px;display:flex;flex-direction:column}
h1{font-size:15px;font-weight:600;color:var(--sub);margin:0 0 28px;letter-spacing:.02em}
.day{font-size:52px;font-weight:800;letter-spacing:-.03em;margin:0}
.muted{color:var(--sub);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;
background:var(--accent);color:var(--accentInk);margin-top:10px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.spacer{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:10px}
.x{background:none;border:0;color:var(--sub);font-size:22px;padding:4px 8px;margin:-4px -8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.word.long{font-size:30px}.word.xlong{font-size:24px}
.word{font-size:40px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:28px 0 8px;word-break:break-word}
.pos{text-align:center;margin-bottom:26px}
.say{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.say button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-family:inherit;font-weight:600;font-size:14px}
.say button:active{transform:scale(.96)}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);
border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:10px;font-size:17px;font-family:inherit}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--bg);color:var(--sub)}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad b{background:var(--bad);color:#fff}
.score{font-size:56px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.score small{font-size:22px;color:var(--sub);font-weight:600}
.list{margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}
.row span:last-child{color:var(--sub);text-align:right}
.hd{display:flex;align-items:center;gap:8px;margin:0 0 20px}.hd h1{margin:0;flex:1}
.badge{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:4px 10px;font-family:inherit;font-weight:700;font-size:12px}
.badge.premium{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.badge.basic{color:var(--accent);border-color:var(--accent)}
.lockbtn{color:var(--sub)}
#fakead{position:fixed;left:0;right:0;bottom:0;height:56px;display:grid;place-items:center;background:#ddd;color:#555;font-size:13px;border-top:1px solid #bbb}
body.withad #app{padding-bottom:72px}
#fakeint{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:18px;z-index:9}
.gear{border:0;background:none;color:var(--sub);font-size:22px;padding:2px 4px}
.dayrow{display:flex;align-items:flex-end;justify-content:space-between}
.link{border:0;background:none;color:var(--accent);font-family:inherit;font-weight:600;font-size:14px;padding:0 0 10px}
.notice{margin-top:4px;line-height:1.6}.notice .btn{font-size:15px;padding:12px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:18px 0 6px}

.amtval{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:34px 0 4px}
.amtval b{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.amtval span{color:var(--sub);font-size:16px}
.amttier{text-align:center;font-size:14px;font-weight:600;min-height:20px;color:var(--sub)}
.amttier.basic{color:#d08a12}.amttier.premium{color:var(--accent)}
.slider{position:relative;margin:30px 18px 8px;height:44px}
.slider .zones{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.z{position:absolute;top:0;bottom:0;opacity:.35}
.z.free{background:#8a8a94}.z.basic{background:#f0a020}.z.premium{background:var(--accent)}
.slider input{position:absolute;left:-15px;right:-15px;width:calc(100% + 30px);top:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}
.slider input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--accent) 0 var(--p,0%),transparent var(--p,0%))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.slider input::-moz-range-track{height:8px;border-radius:4px;background:transparent}
.slider input::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
.slider input::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.ticks{position:absolute;left:0;right:0;top:40px;height:16px}
.ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--sub)}
.legend{display:flex;justify-content:center;gap:14px;margin-top:30px;font-size:12px;color:var(--sub)}
.legend .z{position:static;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;opacity:.6}
.plan{margin-bottom:12px}.plan.cur{border-color:var(--accent)}.plan-h{display:flex;align-items:center;justify-content:space-between;font-size:20px}
.plan ul{margin:10px 0 4px;padding-left:18px;line-height:1.8;color:var(--sub);font-size:14px}
.rowbtn{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;text-align:left;padding:14px 0}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.dayc{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 0 6px;font-family:inherit;font-weight:700;font-size:16px}
.dayc small{display:block;height:14px;font-size:11px;color:var(--ok)}.dayc.prog small{color:var(--accent)}
.dayc.done{background:var(--okbg)}.dayc.on{border-color:var(--accent)}
.decks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin:-12px 0 18px}
.deck{border:0;border-radius:10px;padding:9px 4px;background:transparent;color:var(--sub);font-family:inherit;font-weight:600;font-size:15px}
.deck small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
.deck.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat div{font-size:22px;font-weight:800} .stat span{font-size:12px;color:var(--sub)}
.toast{color:var(--bad);font-weight:600;text-align:center;margin-top:6px;min-height:22px}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script src="phrases.js"></script>
<script src="bsl.js"></script>
<script src="ngsl.js"></script>
<script>
// ---------- 데이터 ----------
const W = [], seen = new Set();
[['T', WORDS_RAW], ['P', PHRASES_RAW], ['B', BSL_RAW], ['G', NGSL_RAW]].forEach(([d, raw]) => raw.trim().split('\n').forEach(l => {
  const [w, p, m] = l.split('|').map(s => s && s.trim());
  if (!w || !m || seen.has(w.toLowerCase())) return;
  seen.add(w.toLowerCase()); W.push({ w, p, m, d });
}));
// 단어장: 토익(TSL+숙어+비즈니스) / 기본(NGSL) / 전부
const DECKS = {
  toeic: { name: '토익', desc: '토익 단어 + 숙어 + 비즈니스 어휘', has: 'TPB' },
  basic: { name: '기본', desc: '일반 영어 핵심 단어 (NGSL)', has: 'G' },
  all:   { name: '전부', desc: '모든 단어와 숙어', has: 'TPBG' },
};
const deckIdx = k => [...W.keys()].filter(i => DECKS[k].has.includes(W[i].d));
const KEY = 'toeic_voca_decks_v1';
// 구독 플랜 (결제 연동 전: 플랜 화면에서 바로 전환되는 테스트용)
const PLANS = {
  free:    { name: 'Free',    max: 20,  banner: true,  endAd: true,  redo: false, oneDay: true,  pick: false,
             perks: ['하루 20개', '하루에 Day 1개씩 진행', '지난 Day 다시 테스트 · 발음 듣기', '오답은 목록으로만 확인 (다시 풀기 ✕)', '문제 풀 때 하단 광고 · 하루치 끝나면 광고'] },
  basic:   { name: 'Basic',   max: 50,  banner: false, endAd: true,  redo: true,  oneDay: true,  pick: false,
             perks: ['하루 20~50개', '하루에 Day 1개씩 진행', '오답 다시 풀기 · 다시 테스트 · 발음 듣기', '하루치 끝날 때만 광고'] },
  premium: { name: 'Premium', max: 100, banner: false, endAd: false, redo: true,  oneDay: false, pick: true,
             perks: ['하루 20~100개', 'Day 2, Day 3… 하고 싶은 만큼 계속', 'Day를 골라서 자유롭게 학습', '모든 기능', '광고 없음'] },
};
const ro = name => name + (name === 'Free' ? '로' : '으로');   // Basic으로 / Premium으로 / Free로
const PLAN_OF = a => a <= PLANS.free.max ? 'free' : a <= PLANS.basic.max ? 'basic' : 'premium';   // 이 학습량을 쓰려면 필요한 최소 등급
const AMT_MIN = 20, AMT_MAX = 100, AMT_STEP = 10;   // 하루 학습량: 20~100개, 10개 단위
const POS = { '명': '명사', '동': '동사', '형': '형용사', '부': '부사', '숙': '숙어' };

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

let ALL, S;
try { ALL = JSON.parse(localStorage.getItem(KEY)); } catch (e) { ALL = null; }
if (!ALL || !ALL.decks) ALL = { deck: 'toeic', decks: {} };
if (!PLANS[ALL.plan]) ALL.plan = 'free';
if (ALL.perDay === undefined) ALL.perDay = null;          // null이면 첫 실행 → 하루 학습량 선택
if (!ALL.lastMainDate) ALL.lastMainDate = '';             // Basic: 하루 1 Day 제한용 (마지막으로 Day를 끝낸 날짜)
const plan = () => PLANS[ALL.plan];
const isPremium = () => ALL.plan === 'premium';

const freshDeck = k => ({ day: 1, order: shuffle(deckIdx(k)), sess: null, history: [], days: [], done: {}, paused: {} });
function useDeck(k) {
  const n = deckIdx(k).length;
  let cur = ALL.decks[k];
  if (!cur || !Array.isArray(cur.order) || cur.order.length !== n)
    cur = { ...freshDeck(k), day: (cur && cur.day) || 1, history: (cur && cur.history) || [] };
  // 이전 버전(하루 100개 고정) 진도 이어받기
  if (!cur.days) { cur.days = []; const old = Math.max(cur.day - 1, cur.sess ? cur.sess.day : 0); for (let i = 0; i < old; i++) cur.days.push({ start: i * 100, count: 100 }); }
  if (!cur.done) { cur.done = {}; (cur.history || []).forEach(x => cur.done[x.day] = true); }
  if (!cur.paused) cur.paused = {};
  ALL.decks[k] = cur; ALL.deck = k; S = cur;
}
useDeck(DECKS[ALL.deck] ? ALL.deck : 'toeic');
if (ALL.perDay != null && ALL.perDay > PLANS[ALL.plan].max) ALL.perDay = PLANS[ALL.plan].max;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ALL)); } catch (e) {} };
save();

// Day마다 단어 범위(시작 위치, 개수)를 처음 열 때 고정 → 학습량을 바꿔도 지난 Day는 그대로
function ensureDays(n) {
  const L = S.order.length;
  while (S.days.length < n) {
    const last = S.days[S.days.length - 1];
    S.days.push({ start: last ? (last.start + last.count) % L : 0, count: ALL.perDay || AMT_MIN });
  }
}
function dayWords(day) {
  ensureDays(day);
  const { start, count } = S.days[day - 1], out = [];
  for (let i = 0; i < count; i++) out.push(S.order[(start + i) % S.order.length]);
  return out;
}
function totalDays() {
  const used = S.days.reduce((a, d) => a + d.count, 0);
  return Math.max(S.days.length + Math.ceil(Math.max(0, S.order.length - used) / (ALL.perDay || AMT_MIN)), S.day);
}
// 학습량을 바꾸면, 아직 시작 안 한 Day 범위는 지워서 새 학습량으로 다시 잡히게
function trimDays() {
  for (const k in ALL.decks) {
    const d = ALL.decks[k]; if (!d.days) continue;
    let keep = 0;
    Object.keys(d.done || {}).forEach(x => keep = Math.max(keep, +x));
    Object.keys(d.paused || {}).forEach(x => keep = Math.max(keep, +x));
    if (d.sess) keep = Math.max(keep, d.sess.day);
    d.days.length = Math.min(d.days.length, keep);
  }
}
// Basic은 하루에 Day 1개: 오늘 이미 Day를 끝냈으면 새 Day 시작 불가 (진행 중인 Day는 계속 가능)
const lockedToday = () => plan().oneDay && ALL.lastMainDate === today();
// Day 이동 (진행 중이던 Day는 잠시 보관했다가 다시 오면 이어서)
function goDay(n) {
  if (S.sess && S.sess.day !== n) { S.paused[S.sess.day] = S.sess; S.sess = null; }
  if (!S.sess && S.paused[n]) { S.sess = S.paused[n]; delete S.paused[n]; }
  S.day = n;
}

// 오답 보기: 같은 품사에서, 정답과 뜻이 겹치지 않는 것으로 3개
function makeChoices(idx) {
  const ans = W[idx], toks = new Set(ans.m.split(/,\s*/));
  const okDistractor = o => o.m !== ans.m && !o.m.split(/,\s*/).some(t => toks.has(t));
  // 단어·숙어를 섞어서 보기 구성: 숙어 문제는 전체에서, 단어 문제는 같은 품사 + 숙어에서
  let pool = shuffle(W.filter((o, k) => k !== idx && (ans.p === '숙' || o.p === ans.p || o.p === '숙') && okDistractor(o)));
  if (pool.length < 3) pool = pool.concat(shuffle(W.filter((o, k) => k !== idx && o.p !== ans.p && okDistractor(o))));
  const picks = [], used = new Set();
  for (const o of pool) { if (!used.has(o.m)) { used.add(o.m); picks.push(o.m); } if (picks.length === 3) break; }
  const opts = shuffle([ans.m, ...picks]);
  return { opts, ans: opts.indexOf(ans.m) };
}

// ---------- 발음 ----------
// 앱에서는 폰의 TTS(Android 브리지), 브라우저 미리보기에서는 Web Speech API 사용
const speakText = text => text.replace(/\b[AB]\b/g, '').replace(/~/g, '').replace(/\s+/g, ' ').trim();
function sayMsg(m) {
  const el = document.getElementById('toast');
  if (el) { el.textContent = m; setTimeout(() => { if (el.textContent === m) el.textContent = ''; }, 3000); }
}
function webSpeak(t, langs) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  langs.forEach(lang => {
    const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-') === lang);
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  });
}
// 한 가지 발음만
function say(text, acc) {
  const t = speakText(text);
  if (window.Android && Android.speak) {
    const r = Android.speak(t, acc);
    if (r === -100) sayMsg('음성 준비 중이에요. 잠시 후 다시 눌러주세요.');
    else if (r < 0) sayMsg((acc === 'uk' ? '영국' : '미국') + ' 영어 음성이 없어요. 설정 → 텍스트 음성 변환에서 음성 데이터를 받아주세요.');
    return;
  }
  webSpeak(t, [acc === 'uk' ? 'en-GB' : 'en-US']);
}
// 미국 → 영국 순서로 (문제 나올 때 자동, 다시 듣기 버튼)
let sayTimer = null;
function sayBoth(text, tries = 0) {
  clearTimeout(sayTimer);
  const t = speakText(text);
  if (window.Android && Android.speakBoth) {
    const r = Android.speakBoth(t);
    if (r === -100 && tries < 10) sayTimer = setTimeout(() => sayBoth(text, tries + 1), 300);   // 앱 시작 직후 엔진 준비 대기
    else if (r === -2) sayMsg('영국 영어 음성이 없어 미국 발음만 나와요. 설정 → 텍스트 음성 변환에서 받을 수 있어요.');
    else if (r === -1) sayMsg('영어 음성이 없어요. 설정 → 텍스트 음성 변환에서 음성 데이터를 받아주세요.');
    return;
  }
  webSpeak(t, ['en-US', 'en-GB']);
}
function sayStop() {
  clearTimeout(sayTimer);
  if (window.Android && Android.stop) Android.stop();
  else if ('speechSynthesis' in window) speechSynthesis.cancel();
}

// ---------- 광고 ----------
// 앱: AdMob(AndroidAds 브리지) · 브라우저 미리보기: 가짜 광고 박스
function adBanner(on) {
  on = !!on && plan().banner;
  if (window.AndroidAds) { AndroidAds.banner(on); return; }
  let el = document.getElementById('fakead');
  if (on && !el) { el = document.createElement('div'); el.id = 'fakead'; el.textContent = '광고 (테스트 배너)'; document.body.appendChild(el); }
  if (!on && el) el.remove();
  document.body.classList.toggle('withad', on);
}
function adInterstitial() {
  if (!plan().endAd) return;
  if (window.AndroidAds) { AndroidAds.interstitial(); return; }
  const o = document.createElement('div'); o.id = 'fakeint';
  o.innerHTML = '<div>광고 (테스트 전면 광고)</div><button class="btn" style="max-width:200px">닫기</button>';
  o.querySelector('button').onclick = () => o.remove();
  document.body.appendChild(o);
}
const lockBtn = (id, text) => `<button class="btn ghost lockbtn" id="${id}">🔒 ${text}</button>`;

// ---------- 화면 ----------
const app = document.getElementById('app');
// 화면이 바뀔 때마다 배너 갱신: 문제 화면(quiz)에서만 bannerOn = true 로 켬
let bannerOn = false;
const _setHTML = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML').set;
const _getHTML = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML').get;
Object.defineProperty(app, 'innerHTML', { get() { return _getHTML.call(this); }, set(v) { _setHTML.call(this, v); adBanner(bannerOn); bannerOn = false; } });

function home() {
  if (ALL.perDay == null) return amountView(true);
  const s = S.sess, n = dayWords(S.day).length;
  const done = S.history.length;
  const avg = done ? Math.round(S.history.reduce((a, h) => a + h.first / h.total * 100, 0) / done) : 0;
  const resume = s && s.day === S.day;
  const locked = lockedToday() && !resume;
  const rDay = resume ? S.day : (S.history.length ? S.history[S.history.length - 1].day : null);
  app.innerHTML = `
    <div class="hd"><h1>TOEIC 영단어</h1>
      <button class="badge ${ALL.plan}" id="planb">${plan().name}</button>
      <button class="gear" id="set" aria-label="설정">⚙︎</button></div>
    <div class="decks">${Object.entries(DECKS).map(([k, d]) => `<button class="deck${k === ALL.deck ? ' on' : ''}" data-k="${k}">${d.name}</button>`).join('')}</div>
    <p class="muted">${DECKS[ALL.deck].desc}</p>
    <div class="dayrow"><p class="day">Day ${S.day}</p>
      <button class="link" id="pick">Day 선택 ${plan().pick ? '›' : '🔒'}</button></div>
    <p class="muted">${n}단어 · 4지선다 · 틀린 단어는 다 맞출 때까지 반복</p>
    <div class="stats">
      <div class="stat"><div>${done}</div><span>완료한 Day</span></div>
      <div class="stat"><div>${done ? avg + '%' : '–'}</div><span>평균 첫 정답률</span></div>
    </div>
    ${locked ? `<div class="card notice"><b>오늘 학습 완료! 🎉</b><br>Day ${S.day}은 내일 열려요.
        <button class="btn ghost" id="up">Premium이면 바로 이어서 할 수 있어요</button></div>`
      : ALL.lastMainDate === today() ? `<p class="muted">오늘 이미 하루치를 끝냈어요. 더 해도 돼요 💪</p>` : ''}
    <div class="spacer"></div>
    ${rDay ? `<button class="btn ghost" id="rt">Day ${rDay} 단어 다시 테스트 (순서 섞기)</button>` : ''}
    ${resume && s.wrong.length ? `<button class="btn ghost" id="wv">지금까지 틀린 ${s.wrong.length}개 보기</button>` : ''}
    ${resume ? `<button class="btn" id="go">이어하기 · ${s.round === 1 ? '' : '오답 ' + s.round + '회차 · '}${s.pos}/${s.queue.length}</button>`
             : locked ? '' : `<button class="btn" id="go">시작하기</button>`}
    <button class="btn ghost" id="hist">기록 보기</button>
    <p class="muted" style="font-size:11px;text-align:center;margin-top:14px">단어 목록: TSL · BSL · NGSL (Browne, Culligan &amp; Phillips) · CC BY-SA 4.0</p>`;
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  document.querySelectorAll('.deck').forEach(b => b.onclick = () => { useDeck(b.dataset.k); save(); home(); });
  on('go', () => { if (!resume) startDay(); quiz(); });
  on('hist', history);
  on('wv', wrongView);
  on('rt', () => startPrac('all', rDay, dayWords(rDay)));
  on('set', settingsView);
  on('planb', () => planView());
  on('up', () => planView());
  on('pick', () => plan().pick ? dayPicker() : planView());
}

// ---------- 하루 학습량 선택 (첫 실행 / 설정) ----------
function amountView(first) {
  const max = plan().max;
  let val = Math.min(ALL.perDay || AMT_MIN, AMT_MAX);
  const pct = v => (v - AMT_MIN) / (AMT_MAX - AMT_MIN) * 100;
  const ticks = [];
  for (let a = AMT_MIN; a <= AMT_MAX; a += AMT_STEP) ticks.push(a);
  app.innerHTML = `
    ${first ? `<h1>TOEIC 영단어</h1>` : `<div class="top"><span>하루 학습량</span><button class="x" id="x">✕</button></div>`}
    <p class="big">하루에 몇 단어<br>공부할까요?</p>
    <p class="muted">${first ? '나중에 설정에서 언제든 바꿀 수 있어요.' : '바꾼 학습량은 아직 시작하지 않은 Day부터 적용돼요.'}</p>
    <div class="amtval"><b id="av">${val}</b><span>개 / 하루</span></div>
    <div class="amttier" id="at"></div>
    <div class="slider">
      <div class="zones">
        <i class="z free" style="left:0;width:${pct(PLANS.free.max)}%"></i>
        <i class="z basic" style="left:${pct(PLANS.free.max)}%;width:${pct(PLANS.basic.max) - pct(PLANS.free.max)}%"></i>
        <i class="z premium" style="left:${pct(PLANS.basic.max)}%;width:${100 - pct(PLANS.basic.max)}%"></i>
      </div>
      <input type="range" id="rng" min="${AMT_MIN}" max="${AMT_MAX}" step="1" value="${val}">
      <div class="ticks">${ticks.map(a => `<span style="left:${pct(a)}%">${a}</span>`).join('')}</div>
    </div>
    <div class="legend"><span><i class="z free"></i>Free ~${PLANS.free.max}</span><span><i class="z basic"></i>Basic ~${PLANS.basic.max}</span><span><i class="z premium"></i>Premium ~${PLANS.premium.max}</span></div>
    <div class="spacer"></div>
    <button class="btn" id="ok"></button>`;
  const rng = document.getElementById('rng'), av = document.getElementById('av'), at = document.getElementById('at'), ok = document.getElementById('ok');
  const snap = v => Math.round(v / AMT_STEP) * AMT_STEP;
  const show = () => {
    const raw = +rng.value; val = snap(raw);
    av.textContent = val;
    rng.style.setProperty('--p', pct(raw) + '%');
    const need = PLAN_OF(val);
    at.className = 'amttier ' + need;
    at.textContent = val > max ? `🔒 ${PLANS[need].name}${need === 'premium' ? '' : ' 이상'} 필요` : `${plan().name}에서 사용 가능`;
    ok.textContent = val > max ? `${ro(PLANS[need].name)} 업그레이드` : first ? `하루 ${val}개로 시작하기` : `하루 ${val}개로 저장`;
  };
  // 드래그하는 동안은 부드럽게 움직이고, 손을 떼면 10개 단위 눈금에 착 붙음
  rng.oninput = show;
  rng.onchange = () => { rng.value = snap(+rng.value); show(); };
  show();
  const x = document.getElementById('x'); if (x) x.onclick = settingsView;
  ok.onclick = () => {
    if (val > plan().max) return planView({ want: val, first });
    setAmount(val); first ? home() : settingsView();
  };
}
function setAmount(a) { ALL.perDay = Math.min(a, plan().max); trimDays(); save(); }

// ---------- 구독 플랜 ----------
function planView(opt = {}) {
  app.innerHTML = `
    <div class="top"><span>구독</span><button class="x" id="x">✕</button></div>
    ${opt.want ? `<p class="muted">하루 ${opt.want}개는 ${PLANS[PLAN_OF(opt.want)].name}부터 쓸 수 있어요.</p>` : ''}
    ${Object.entries(PLANS).map(([k, p]) => `
      <div class="card plan ${k}${k === ALL.plan ? ' cur' : ''}">
        <div class="plan-h"><b>${p.name}</b>${k === ALL.plan ? '<span class="chip">이용 중</span>' : ''}</div>
        <ul>${p.perks.map(t => `<li>${t}</li>`).join('')}</ul>
        ${k === ALL.plan ? '' : `<button class="btn${k === 'premium' ? '' : ' ghost'}" data-p="${k}">${ro(p.name)}${Object.keys(PLANS).indexOf(k) > Object.keys(PLANS).indexOf(ALL.plan) ? ' 업그레이드' : ' 변경'}</button>`}
      </div>`).join('')}
    <p class="muted" style="font-size:12px">※ 결제 연동 전 테스트 버전이라 누르면 바로 바뀌어요.</p>
    <div class="spacer"></div>`;
  document.getElementById('x').onclick = () => opt.first ? amountView(true) : home();
  document.querySelectorAll('.plan .btn').forEach(b => b.onclick = () => {
    ALL.plan = b.dataset.p;
    if (opt.want && opt.want <= plan().max) setAmount(opt.want);
    else if (ALL.perDay != null && ALL.perDay > plan().max) setAmount(plan().max);   // 등급을 낮추면 학습량도 그 등급 최대치로
    save(); home();
  });
}

// ---------- 설정 ----------
function settingsView() {
  app.innerHTML = `
    <div class="top"><span>설정</span><button class="x" id="x">✕</button></div>
    <div class="card list">
      <button class="row rowbtn" id="amt"><span>하루 학습량</span><span>${ALL.perDay}개 ›</span></button>
      <button class="row rowbtn" id="pl"><span>구독</span><span>${plan().name} ›</span></button>
    </div>
    <div class="spacer"></div>`;
  document.getElementById('x').onclick = home;
  document.getElementById('amt').onclick = () => amountView(false);
  document.getElementById('pl').onclick = () => planView();
}

// ---------- Day 선택 (Premium) ----------
function dayPicker() {
  const N = totalDays(), inprog = new Set(Object.keys(S.paused).map(Number));
  if (S.sess) inprog.add(S.sess.day);
  app.innerHTML = `
    <div class="top"><span>Day 선택 · ${DECKS[ALL.deck].name}</span><button class="x" id="x">✕</button></div>
    <p class="muted">원하는 Day를 골라서 학습하세요. ✓ 완료 · ● 진행 중</p>
    <div class="days">${Array.from({ length: N }, (_, i) => i + 1).map(d =>
      `<button class="dayc${S.done[d] ? ' done' : ''}${inprog.has(d) ? ' prog' : ''}${d === S.day ? ' on' : ''}" data-d="${d}">${d}<small>${S.done[d] ? '✓' : inprog.has(d) ? '●' : ''}</small></button>`).join('')}</div>`;
  document.getElementById('x').onclick = home;
  document.querySelectorAll('.dayc').forEach(b => b.onclick = () => { goDay(+b.dataset.d); save(); home(); });
}

// 연습 모드(진도·기록에 영향 없음): 'all' = 그 Day 단어 전체 다시 테스트, 'wrong' = 지금까지 틀린 단어
function startPrac(kind, day, items) {
  quiz({ prac: kind, day, items: [...items], round: 0, queue: shuffle([...items]), pos: 0, wrong: [], cur: null, picked: null });
}

// 중간 오답 보기: 진도에는 영향 없음 (오답들은 그대로 회차 끝 복습에도 다시 나옴)
function wrongView() {
  const list = S.sess.wrong;
  app.innerHTML = `
    <div class="top"><span>Day ${S.sess.day} · 지금까지 틀린 ${list.length}개</span><button class="x" id="x">✕</button></div>
    <div class="card list">${list.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>
    <div class="spacer"></div>
    ${plan().redo ? `<button class="btn" id="go">이 단어들 풀어보기</button>` : lockBtn('up', '오답 다시 풀기는 Basic부터')}
    <button class="btn ghost" id="back">돌아가기</button>`;
  document.getElementById('x').onclick = home;
  document.getElementById('back').onclick = home;
  const go = document.getElementById('go'); if (go) go.onclick = () => startPrac('wrong', S.sess.day, list);
  const up = document.getElementById('up'); if (up) up.onclick = () => planView();
}

function startDay() {
  S.sess = { day: S.day, round: 1, queue: shuffle(dayWords(S.day)), pos: 0, wrong: [], firstScore: null, cur: null, picked: null };
  save();
}

let active = null;
function quiz(s = S.sess) {
  active = s;
  const persist = () => { if (!s.prac) save(); };
  if (s.pos >= s.queue.length) return s.prac ? pracResult(s) : result();
  const idx = s.queue[s.pos], w = W[idx];
  if (!s.cur || s.cur.idx !== idx) { s.cur = { idx, ...makeChoices(idx) }; s.picked = null; persist(); }
  const c = s.cur;
  bannerOn = true;
  app.innerHTML = `
    <div class="top"><span>Day ${s.day} · ${s.prac === 'all' ? '다시 테스트' : s.prac ? '오답 미리 풀기' : s.round === 1 ? '본 학습' : '오답 ' + s.round + '회차'}</span>
      <span>${s.pos + 1} / ${s.queue.length} <button class="x" id="x">✕</button></span></div>
    <div class="bar"><i style="width:${s.pos / s.queue.length * 100}%"></i></div>
    <div class="word${w.w.length > 22 ? ' xlong' : w.w.length > 13 ? ' long' : ''}">${esc(w.w)}</div>
    <div class="pos"><span class="chip">${POS[w.p] || w.p}</span>
      <div class="say"><button id="replay">🔁 다시 듣기</button><button data-a="us">🔊 미국</button><button data-a="uk">🔊 영국</button></div></div>
    <div id="opts">${c.opts.map((m, i) => `<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(m)}</span></button>`).join('')}</div>
    <div class="toast" id="toast"></div>
    <div class="spacer"></div>
    <button class="btn" id="next" style="visibility:hidden">다음 →</button>`;
  document.getElementById('x').onclick = () => { active = null; sayStop(); home(); };
  document.querySelectorAll('.say button[data-a]').forEach(b => b.onclick = () => say(w.w, b.dataset.a));
  document.getElementById('replay').onclick = () => sayBoth(w.w);
  if (s.picked == null) sayBoth(w.w);   // 새 문제가 나오면 미국 → 영국 순서로 자동 재생
  const btns = [...document.querySelectorAll('.opt')];
  const next = document.getElementById('next');
  const advance = () => { s.pos++; s.cur = null; s.picked = null; persist(); quiz(s); };
  next.onclick = advance;
  const reveal = (pick, auto) => {
    btns[c.ans].classList.add('ok');
    if (pick !== c.ans) { btns[pick].classList.add('bad'); document.getElementById('toast').textContent = '오답 — 정답: ' + 'ABCD'[c.ans]; }
    next.style.visibility = 'visible';
    if (pick === c.ans && auto) setTimeout(() => { if (active === s && s.cur === c) advance(); }, 550);
  };
  if (s.picked != null) reveal(s.picked, false);   // 앱을 껐다 켰을 때 답 고른 상태 복원
  btns.forEach(b => b.onclick = () => {
    if (s.picked != null) return;
    const pick = +b.dataset.i;
    s.picked = pick;
    if (pick !== c.ans && !s.wrong.includes(idx)) s.wrong.push(idx);
    persist();
    reveal(pick, true);
  });
}

function pracResult(s) {
  active = null;
  const total = s.queue.length, right = total - s.wrong.length;
  const resume = S.sess && S.sess.day === S.day;
  app.innerHTML = `
    <h1>Day ${s.day} · ${s.prac === 'all' ? '다시 테스트' : '오답 미리 풀기'} 결과</h1>
    <p class="muted">맞힌 개수</p>
    <p class="score">${right}<small> / ${total}</small></p>
    <p class="muted">${s.wrong.length ? '아직 헷갈리는 단어예요.' : '다 맞혔어요! 👍'} 연습이라 진도·기록에는 영향이 없어요.</p>
    ${s.wrong.length ? `<div class="card list">${s.wrong.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>` : ''}
    <div class="spacer"></div>
    <button class="btn" id="again">한 번 더 (순서 섞어서)</button>
    ${s.wrong.length && s.wrong.length < total ? (plan().redo ? `<button class="btn ghost" id="wrongonly">틀린 ${s.wrong.length}개만 다시</button>` : lockBtn('up', `틀린 ${s.wrong.length}개만 다시 (Basic부터)`)) : ''}
    ${resume ? `<button class="btn ghost" id="go">본 학습 이어하기</button>` : ''}
    <button class="btn ghost" id="back">홈으로</button>`;
  document.getElementById('again').onclick = () => startPrac(s.prac, s.day, s.items);
  const wo = document.getElementById('wrongonly');
  if (wo) wo.onclick = () => startPrac('wrong', s.day, s.wrong);
  const up = document.getElementById('up'); if (up) up.onclick = () => planView();
  const go = document.getElementById('go');
  if (go) go.onclick = () => quiz();
  document.getElementById('back').onclick = home;
}

function result() {
  const s = S.sess, total = s.queue.length, wrongN = s.wrong.length, right = total - wrongN;
  if (s.round === 1 && s.firstScore == null) { s.firstScore = right; save(); }
  const redo = wrongN && plan().redo;     // Free: 오답은 목록만 보고, 다시 풀기 없이 완료
  app.innerHTML = `
    <h1>Day ${s.day} · ${s.round === 1 ? '본 학습 결과' : '오답 ' + s.round + '회차 결과'}</h1>
    <p class="muted">맞힌 개수</p>
    <p class="score">${right}<small> / ${total}</small></p>
    ${wrongN ? `<p class="muted">${redo ? `틀린 ${wrongN}개를 다시 풀어요.` : `틀린 ${wrongN}개예요. 뜻을 확인해두세요.`}</p>
      <div class="card list">${s.wrong.map(i => `<div class="row"><span><b>${esc(W[i].w)}</b></span><span>${esc(W[i].m)}</span></div>`).join('')}</div>`
      : `<p class="muted">${s.round === 1 ? '한 번에 다 맞혔어요! 🎉' : '오답까지 전부 맞혔어요! 🎉'}</p>`}
    <div class="spacer"></div>
    ${redo ? `<button class="btn" id="go">오답 다시 풀기 (${wrongN}개)</button>`
           : `${wrongN ? lockBtn('up', '오답 다시 풀기는 Basic부터') : ''}<button class="btn" id="go">완료${plan().oneDay ? '' : ' · 다음 Day로'}</button>`}`;
  const up = document.getElementById('up'); if (up) up.onclick = () => planView();
  document.getElementById('go').onclick = () => {
    if (redo) {
      Object.assign(s, { round: s.round + 1, queue: shuffle([...s.wrong]), pos: 0, wrong: [], cur: null, picked: null });
      save(); quiz();
    } else {
      S.history.push({ day: s.day, date: today(), first: s.firstScore, total: dayWords(s.day).length, rounds: s.round });
      S.done[s.day] = true; ALL.lastMainDate = today(); S.sess = null;
      let nx = s.day + 1; while (S.done[nx]) nx++;
      goDay(nx); save(); home();
      adInterstitial();          // Free·Basic: 하루치가 끝나면 전면 광고
    }
  };
}

function history() {
  const h = [...S.history].reverse();
  app.innerHTML = `
    <div class="top"><span>학습 기록 · ${DECKS[ALL.deck].name}</span><button class="x" id="x">✕</button></div>
    ${h.length ? `<div class="card list">${h.map(x => `<div class="row"><span><b>Day ${x.day}</b> · ${x.date}</span>
      <span>첫 정답 ${x.first}/${x.total} · ${x.rounds}회차</span></div>`).join('')}</div>`
      : `<p class="muted">아직 기록이 없어요.</p>`}
    <div class="spacer"></div>
    <button class="btn ghost" id="reset">이 단어장 초기화</button>`;
  document.getElementById('x').onclick = home;
  document.getElementById('reset').onclick = () => {
    if (confirm(`'${DECKS[ALL.deck].name}' 단어장의 진도와 기록을 지울까요?`)) { useDeck(ALL.deck); ALL.decks[ALL.deck] = freshDeck(ALL.deck); S = ALL.decks[ALL.deck]; save(); home(); }
  };
}

home();
</script>
</body>
</html>
