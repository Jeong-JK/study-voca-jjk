name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk ToeicVoca.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ToeicVoca
          path: ToeicVoca.apk
      # 최신 APK를 고정 링크로 받을 수 있게 Release에 올림
      # https://github.com/Jeong-JK/study-voca-jjk/releases/latest/download/ToeicVoca.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ToeicVoca v1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: ToeicVoca.apk
          make_latest: true
